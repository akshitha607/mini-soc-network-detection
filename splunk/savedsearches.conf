# Scheduled alerts. Copy into $SPLUNK_HOME/etc/apps/search/local/savedsearches.conf
# (or recreate through Settings > Searches, reports, and alerts) and restart Splunk.

[SOC - High severity detection]
search = index=soc_lab sourcetype=soc:alert severity=high | stats count, values(description) AS details by src_ip, alert_type, mitre_technique
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
action.email = 0

[SOC - Recon then brute force from same source]
search = index=soc_lab sourcetype=soc:alert (alert_type=port_scan OR alert_type=brute_force) | stats dc(alert_type) AS stages by src_ip | where stages >= 2
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 5
alert.track = 1
action.email = 0
